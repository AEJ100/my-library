  카피라이팅: ["#f3e5f5","#6a1b9a"], 심리: ["#e8f5e9","#1b5e20"],
  영업: ["#fff3e0","#bf360c"], 인테리어: ["#e0f2f1","#004d40"],
  투자: ["#fff8e1","#f57f17"], 창업: ["#ede7f6","#311b92"],
  자기계발: ["#fbe9e7","#c62828"], 콘텐츠: ["#e1f5fe","#01579b"],
  미분류: ["#f5f5f5","#424242"],
};

const FOLDER_ORDER = ["마케팅","브랜딩","카피라이팅","심리_행동경제학","영업_세일즈","인테리어_공간","투자_재테크","창업_비즈니스","자기계발","콘텐츠_설계자"];

let activeFilter = "all";
let searchQuery = "";

function escape(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function highlight(text, query) {
  if (!query) return escape(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return escape(text);
  return escape(text.slice(0, idx)) + '<mark>' + escape(text.slice(idx, idx + query.length)) + '</mark>' + escape(text.slice(idx + query.length));
}

function getFolderInfo(folder) {
  return FOLDER_DISPLAY[folder] || {label: folder, emoji: "📂", cls: "미분류"};
}

function getColors(cls) {
  const isDark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (isDark) return ["#2a2520","#c8b89a"];
  return FOLDER_COLORS[cls] || FOLDER_COLORS["미분류"];
}

// ── 책 표지 로딩 ──────────────────────────────────────────
const COVER_TTL = 30 * 24 * 3600 * 1000; // 30일

function getCoverCache(title) {
  try {
    const raw = localStorage.getItem('gc_' + title);
    if (!raw) return null;
    const item = JSON.parse(raw);
    if (Date.now() - item.ts > COVER_TTL) { localStorage.removeItem('gc_' + title); return null; }
    return item.url; // null = "not found", string = URL
  } catch { return null; }
}

function setCoverCache(title, url) {
  try { localStorage.setItem('gc_' + title, JSON.stringify({url, ts: Date.now()})); } catch {}
}

async function fetchCoverUrl(title) {
  const q = encodeURIComponent(title);
  const url = `https://www.googleapis.com/books/v1/volumes?q=intitle:${q}&maxResults=3&fields=items/volumeInfo/imageLinks`;
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    if (!data.items) return null;
    for (const item of data.items) {
      const links = item.volumeInfo?.imageLinks;
      if (links) {
        const src = (links.medium || links.small || links.thumbnail || '').replace('http://', 'https://').replace('zoom=1', 'zoom=2');
        if (src) return src;
      }
    }
  } catch {}
  return null;
}

let coverObserver = null;

function initCoverObserver() {
  if (coverObserver) coverObserver.disconnect();
  coverObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const wrap = entry.target;
      coverObserver.unobserve(wrap);
      const title = wrap.dataset.title;
      const img = wrap.querySelector('.cover-img');
      if (!img || img.dataset.loaded) return;
      img.dataset.loaded = '1';

      const cached = getCoverCache(title);
      if (cached === null) {
        // 캐시 없음 → API 호출
        fetchCoverUrl(title).then(url => {
          setCoverCache(title, url);
          if (url) { img.src = url; img.onload = () => img.classList.add('loaded'); }
        });
      } else if (cached) {
        img.src = cached;
        img.onload = () => img.classList.add('loaded');
      }
      // cached === null (저장된 "없음") 이면 fallback 유지
    });
  }, { rootMargin: '300px' });

  document.querySelectorAll('.cover-wrap[data-title]').forEach(el => coverObserver.observe(el));
}

function bookCardHtml(b, titleHtml, showFolder) {
  const info = getFolderInfo(b.folder);
  const [bg, fg] = getColors(info.cls);
  const folderBadge = showFolder ? `<div class="card-folder-badge">${info.emoji} ${info.label}</div>` : '';
  return `<div class="book-card${showFolder ? ' search-book-card' : ''}">
    <div class="cover-wrap" data-title="${escape(b.title)}">
      <img class="cover-img" alt="${escape(b.title)}">
      <div class="cover-fallback" style="background:${bg}">
        <span class="cover-fallback-emoji">${info.emoji}</span>
        <span class="cover-fallback-title" style="color:${fg}">${escape(b.title)}</span>
      </div>
    </div>
    <div class="card-title">${titleHtml}</div>
    ${folderBadge}
  </div>`;
}

function render() {
  const q = searchQuery.trim().toLowerCase();
  const container = document.getElementById('bookContainer');
  const resultInfo = document.getElementById('resultInfo');

  const filtered = BOOKS.filter(b => {
    const matchFolder = activeFilter === 'all' || b.folder === activeFilter;
    const matchSearch = !q || b.title.toLowerCase().includes(q);
    return matchFolder && matchSearch;
  });

  document.getElementById('totalCount').textContent = `${BOOKS.length}권`;

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">"${escape(q)}" 검색 결과가 없습니다</div></div>`;
    resultInfo.innerHTML = '';
    return;
  }

  if (q) {
    resultInfo.innerHTML = `<strong>${filtered.length}권</strong> 검색됨`;
  } else if (activeFilter !== 'all') {
    const info = getFolderInfo(activeFilter);
    resultInfo.innerHTML = `${info.emoji} <strong>${info.label}</strong> · ${filtered.length}권`;
  } else {
    resultInfo.innerHTML = '';
  }

  // 검색 모드: 표지 그리드 (카테고리 배지 포함)
  if (q) {
    const cards = filtered.map(b => bookCardHtml(b, highlight(b.title, q), true)).join('');
    container.innerHTML = `<div class="book-grid">${cards}</div>`;
    initCoverObserver();
    return;
  }

  // 카테고리 뷰: 섹션별 그리드
  const byFolder = {};
  BOOKS.forEach(b => {
    if (!byFolder[b.folder]) byFolder[b.folder] = [];
    byFolder[b.folder].push(b);
  });

  const folders = activeFilter === 'all'
    ? FOLDER_ORDER.filter(f => byFolder[f])
    : [activeFilter];

  let html = '';
  folders.forEach(folder => {
    const books = byFolder[folder] || [];
    if (!books.length) return;
    const info = getFolderInfo(folder);
    const [bg, fg] = getColors(info.cls);
    const cards = books.map(b => bookCardHtml(b, escape(b.title), false)).join('');
    html += `<div class="category-section">
      <div class="category-header">
        <span class="cat-badge" style="background:${bg};color:${fg}">${info.emoji} ${info.label}</span>
        <span class="cat-count">${books.length}권</span>
      </div>
      <div class="book-grid">${cards}</div>
    </div>`;
  });
  container.innerHTML = html;
  initCoverObserver();
}

// 이벤트
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('filterTabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeFilter = tab.dataset.cat;
  document.getElementById('search').value = '';
  searchQuery = '';
  render();
});

// 초기 렌더
render();
</script>

<div id="pinOverlay" style="

  </div>
  <div id="pinError" style="color:#e53935; font-size:0.85rem; min-height:1.2em;"></div>
  <div style="display:grid; grid-template-columns:repeat(3,70px); gap:12px;">
    <button class="pin-btn" onclick="pinInput('1')">1</button>
    <button class="pin-btn" onclick="pinInput('2')">2</button>
    <button class="pin-btn" onclick="pinInput('3')">3</button>
    <button class="pin-btn" onclick="pinInput('4')">4</button>
    <button class="pin-btn" onclick="pinInput('5')">5</button>
    <button class="pin-btn" onclick="pinInput('6')">6</button>
    <button class="pin-btn" onclick="pinInput('7')">7</button>
    <button class="pin-btn" onclick="pinInput('8')">8</button>
    <button class="pin-btn" onclick="pinInput('9')">9</button>
    <button class="pin-btn" onclick="pinInput('←')" style="background:var(--border);">←</button>
    <button class="pin-btn" onclick="pinInput('0')">0</button>
    <button class="pin-btn" onclick="pinInput('←')" style="background:var(--border);">⌫</button>
  </div>
</div>
<style>
  .dot {
    width:14px; height:14px; border-radius:50%;
    background:var(--border); border:2px solid var(--muted);
    transition:background .15s;
  }
  .dot.filled { background:var(--accent); border-color:var(--accent); }
  .pin-btn {
    width:70px; height:70px; border-radius:50%; border:none;
    background:var(--surface); color:var(--fg);
    font-size:1.4rem; font-weight:600; cursor:pointer;
    box-shadow:var(--shadow); font-family:inherit;
    transition:background .1s;
  }
  .pin-btn:active { background:var(--accent-bg); }
</style>
<script>
(function() {
  const CORRECT_PIN = '12210501';
  const SESSION_KEY = 'library_unlocked';
  let entered = '';

  function checkUnlock() {
    try {
      if (sessionStorage.getItem(SESSION_KEY) === '1') return; // 이미 인증됨
    } catch(e) {}
    document.getElementById('pinOverlay').style.display = 'flex';
    document.querySelector('.container') && (document.querySelector('.container').style.visibility = 'hidden');
  }

  function updateDots() {
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('filled', i < entered.length);
    });
  }

  window.pinInput = function(val) {
    if (val === '←') {
      entered = entered.slice(0, -1);
      document.getElementById('pinError').textContent = '';
      updateDots();
      return;
    }
    if (entered.length >= 8) return;
    entered += val;
    updateDots();
    if (entered.length === 8) {
      if (entered === CORRECT_PIN) {
        try { sessionStorage.setItem(SESSION_KEY, '1'); } catch(e) {}
        document.getElementById('pinOverlay').style.display = 'none';
        document.querySelector('.container') && (document.querySelector('.container').style.visibility = '');
      } else {
        document.getElementById('pinError').textContent = '❌ 잘못된 PIN입니다';
        entered = '';
        updateDots();
      }
    }
  };

  // 키보드 지원
  document.addEventListener('keydown', function(e) {
    if (document.getElementById('pinOverlay').style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') pinInput(e.key);
    else if (e.key === 'Backspace') pinInput('←');
  });

  checkUnlock();
})();
</script>
