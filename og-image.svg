<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#2d2318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8773a"/>
      <stop offset="100%" stop-color="#e8924e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 왼쪽 장식 선 -->
  <rect x="80" y="80" width="4" height="470" rx="2" fill="url(#accent)" opacity="0.6"/>

  <!-- 책장 느낌 책들 (오른쪽) -->
  <g opacity="0.15">
    <rect x="820" y="120" width="38" height="300" rx="4" fill="#c8773a"/>
    <rect x="864" y="160" width="30" height="260" rx="4" fill="#e8924e"/>
    <rect x="900" y="140" width="44" height="280" rx="4" fill="#c8773a"/>
    <rect x="950" y="100" width="36" height="320" rx="4" fill="#d4824a"/>
    <rect x="992" y="150" width="28" height="270" rx="4" fill="#c8773a"/>
    <rect x="1026" y="130" width="40" height="290" rx="4" fill="#e8924e"/>
    <rect x="1072" y="110" width="34" height="310" rx="4" fill="#c8773a"/>
    <!-- 책장 선반 -->
    <rect x="800" y="420" width="320" height="8" rx="2" fill="#c8773a"/>
  </g>

  <!-- 메인 텍스트 -->
  <text x="120" y="220" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="72" font-weight="700" fill="#f0ede6">내 서재</text>

  <!-- 서브 텍스트 -->
  <text x="123" y="285" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="30" fill="#958e82" letter-spacing="2">My Personal Library</text>

  <!-- 구분선 -->
  <rect x="120" y="320" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- 통계 -->
  <text x="120" y="390" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="26" fill="#c8773a" font-weight="600">📚 109권 보유</text>
  <text x="120" y="435" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#7a766e">마케팅 · 브랜딩 · 투자 · 자기계발 · 심리학</text>
  <text x="120" y="475" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" fill="#7a766e">카피라이팅 · 영업 · 창업 · 인테리어 · 콘텐츠</text>

  <!-- 하단 URL -->
  <text x="120" y="560" font-family="monospace" font-size="20" fill="#4a4640">aej100.github.io/my-library</text>

  <!-- 하단 장식 -->
  <rect x="80" y="590" width="1040" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
</svg>
