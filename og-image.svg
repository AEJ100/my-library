    <rect x="40" y="450" width="284" height="7" rx="3" fill="#c8773a"/>

    <rect x="900" y="180" width="32" height="270" rx="4" fill="#c8773a"/>
    <rect x="938" y="210" width="26" height="240" rx="4" fill="#e8924e"/>
